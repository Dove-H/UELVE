pretrained_model_path: /mnt/fspace/hproject/model/stable-diffusion-v1-5
output_dir: ./outputs/wolf8f
train_data:
  video_path: ./data/wolf8f
  prompt: a wolf
  n_sample_frames: 8
  width: 512
  height: 512
  sample_start_idx: 0
  sample_frame_rate: 1
validation_data:
  prompts:
  - a wolf
  video_length: 8
  width: 512
  height: 512
  num_inference_steps: 50
  guidance_scale: 12.5
  use_inv_latent: true
  num_inv_steps: 50
learning_rate: 3e-5
train_batch_size: 1
max_train_steps: 300
checkpointing_steps: 1000
validation_steps: 500
trainable_modules:
- attn1.to_q
- attn2.to_q
- attn_temp
seed: 33
mixed_precision: fp16
use_8bit_adam: false
gradient_checkpointing: false
enable_xformers_memory_efficient_attention: true
grid_sizeH: 2
grid_sizeW: 2
