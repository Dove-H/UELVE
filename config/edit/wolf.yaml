# CUDA_VISIBLE_DEVICES=0 python test_fatezero.py --config config/teaser/jeep_posche.yaml

pretrained_model_path: /mnt/fspace/hproject/model/stable-diffusion-v1-5
method: "FateZero"  #FateZero,ControlNet
control_class: "depth_zoe"
Use_DeepSeek: True
tune-yaml: config/tune/wolf-tune.yaml
dataset_config:
    path: "data/wolf8f"
    prompt: "a wolf" # RENAME Inversion editing_prompts
    n_sample_frame: 8
    sampling_rate: 1
    stride: 80
    offset: 
        left: 0
        right: 0
        top: 0
        bottom: 0


editing_config:
    use_invertion_latents: True
    use_inversion_attention: True
    grid_sizeH: 2
    grid_sizeW: 2
    editing_prompts: [
        a wolf in watercolor painting,
    ]
    p2p_config:
        0:
            cross_replace_steps:
                default_: 0.6
            self_replace_steps: 0.6
            latent_replace_steps: [0.2, 0.8]
            use_inversion_attention: True 
            is_replace_controller: True
            eq_params:  
                  words: ["watercolor"]
                  values: [3]  
            blend_words: [['wolf',]]
            blend_latents: True
            blend_latents_th: [0.4, 0.4]
            blend_self_attention: True
            blend_self_th: [0.4, 0.4]



    clip_length: "${..dataset_config.n_sample_frame}"
    sample_seeds: [0]
    prompt2prompt_edit: True # Need study

    # DDIM parameters
    guidance_scale: 7.5
    num_inference_steps: 50
    
model_config:
    lora: 160
test_pipeline_config:
    target: video_diffusion.pipelines.p2p_ddim_spatial_temp.P2pDDIMSpatiotempPipeline
seed: 0

