# CUDA_VISIBLE_DEVICES=0 python test_fatezero.py --config config/teaser/jeep_posche.yaml

pretrained_model_path: "/mnt/fspace/hproject/model/stable-diffusion-v1-5/"
method: "FateZero"  #FateZero,ControlNet
control_class: "depth_zoe"
Use_DeepSeek: True
tune-yaml: config/tune/fish48f-tune.yaml  # DeepSeek temporal 路由时自主启动的 tune 配置（不填则按数据集路径自动匹配）
dataset_config:
    path: "data/fish48f"
    prompt: "a fish is swimming" # RENAME Inversion editing_prompts
    n_sample_frame: 48
    sampling_rate: 1
    stride: 80
    offset: 
        left: 0
        right: 0
        top: 0
        bottom: 0


editing_config:
    use_invertion_latents: True
    use_inversion_attention: True
    grid_sizeH: 2
    grid_sizeW: 2
    editing_prompts: [
        a crochet fish is swimming,
    ]
    p2p_config:
        0:
            cross_replace_steps: #什么时候开始替换cross attention
                default_: 0.6
            self_replace_steps: 0.6 #什么时候开始替换self attention
            latent_replace_steps: [0.2, 0.8] # latent blend 时间窗口（比例×总步数）
            use_inversion_attention: True 
            is_replace_controller: True #True时用attentionreplace，prompt相同字数替换，False时用attentionrefine
            eq_params:  
                  words: ["crochet"]
                  values: [3]  
            blend_words: [['fish',]]
            blend_latents: True
            blend_latents_th: [0.4, 0.4]   # latent blend 掩码二值化阈值
            blend_self_attention: True    # 形状改变类编辑时开 True
            blend_self_th: [0.4, 0.4]      # self-attention 掩码二值化阈值



    clip_length: "${..dataset_config.n_sample_frame}"
    sample_seeds: [0]
    prompt2prompt_edit: True # Need study

    # DDIM parameters
    guidance_scale: 7.5
    num_inference_steps: 50
    
model_config:
    lora: 160
test_pipeline_config:
    target: video_diffusion.pipelines.p2p_ddim_spatial_temp.P2pDDIMSpatiotempPipeline  # target 会随 method 自动校正（test_fatezero.py 启动时），切模式只改上面 method 一行即可
seed: 0
llm_decision:  # 自动写入：多卡时 rank0 的 DeepSeek 决策（重跑会覆盖；Use_DeepSeek=False 时忽略）
  adaption: 'mask , one-shot(temporal module)'
  paradigm: temporal
  written_at: 1793364123.6778529
